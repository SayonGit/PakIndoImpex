services:
  db:
    image: postgres:16-alpine
    container_name: pakindo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pakindo
      POSTGRES_PASSWORD: pakindo_dev_password
      POSTGRES_DB: pakindo_impex
    ports:
      - "5432:5432"
    volumes:
      - pakindo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakindo -d pakindo_impex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pakindo_pg_data:
